<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Account Evaluator</title>
<style>
:root{
  color-scheme:light;
  --surface:#fcfcfb; --band:#f1f3f5; --ink:#101820; --ink2:#4a5560; --muted:#737d87;
  --rule:#dfe3e6; --axis:#c2c8cd; --head:#17324d; --head-ink:#f4f7fa; --head-dim:#a9bccf;
  --btn:#17324d; --btn-ink:#ffffff; --focus:#2a78d6; --up:#006300; --down:#b3261e; --warn-bg:#fff4d6; --warn-ink:#5c4300;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --b1:#4a5560; --b2:#98a1a9;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --surface:#1a1a19; --band:#232322; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --rule:#2c2c2a; --axis:#383835; --head:#10202f; --head-ink:#f0efec; --head-dim:#8fa3b8;
    --btn:#cfe0f2; --btn-ink:#10202f; --focus:#3987e5; --up:#0ca30c; --down:#e66767; --warn-bg:#3a3214; --warn-ink:#f3dc9a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --b1:#c3c2b7; --b2:#77766f;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface);color:var(--ink);font:15px/1.45 "Avenir Next","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{background:var(--head);color:var(--head-ink);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:12px}
header.top h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.01em}
header.top .asof{font-size:13px;color:var(--head-dim);text-align:right}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--head)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;color:var(--head-dim);padding:10px 12px 9px;font-weight:500;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--head-ink);border-bottom-color:var(--head-ink)}
.scope{background:var(--band);border-bottom:1px solid var(--rule)}
.scope .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.scope .wrap::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--axis);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;display:inline-block}
main{padding:22px 0 60px}
section{padding:22px 0;border-top:1px solid var(--rule)}
section:first-child{border-top:0;padding-top:4px}
h2{font-size:20px;line-height:1.2;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:15px;font-weight:600;margin:18px 0 6px}
p{margin:0 0 10px;max-width:68ch}
.sub{color:var(--ink2);margin:0 0 14px;max-width:68ch}
.small{font-size:13px;color:var(--ink2)}
.hero-label{color:var(--ink2);margin:0}
.hero{font-size:clamp(44px,13vw,64px);line-height:1.02;font-weight:600;letter-spacing:-.025em;margin:2px 0 8px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 0 0;border-top:1px solid var(--rule)}
.facts>div{padding:10px 12px 2px 0}
.facts>div+div{border-left:1px solid var(--rule);padding-left:12px}
.facts .k{font-size:13px;color:var(--ink2);display:block}
.facts .v{font-size:19px;font-weight:600;display:block;margin-top:2px}
.facts .n{font-size:12.5px;color:var(--ink2);display:block}
@media (max-width:520px){.facts{grid-template-columns:1fr}.facts>div+div{border-left:0;border-top:1px solid var(--rule);padding-left:0}.facts>div{padding:8px 0;display:grid;grid-template-columns:1fr auto;align-items:baseline;column-gap:10px}.facts .n{grid-column:1/-1}.facts .v{margin:0}}
.up{color:var(--up)} .down{color:var(--down)}
figure{margin:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink2);margin:0 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.ln{width:16px;height:0;border-top:2.5px solid;display:inline-block;border-radius:2px}
.chart{width:100%;touch-action:pan-y;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart text.lab{fill:var(--ink2);font-size:12px}
.chart text.val{fill:var(--ink);font-size:12px;font-weight:600}
details.nums{margin-top:8px}
details>summary{cursor:pointer;color:var(--ink2);font-size:13.5px;padding:6px 0;width:fit-content}
.tscroll{overflow-x:auto;margin-top:6px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px 7px 0;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule)}
th:last-child,td:last-child{padding-right:0}
th{font-weight:500;color:var(--ink2);font-size:12.5px;vertical-align:bottom;white-space:normal}
th.l,td.l{text-align:left}
table:not(.edit) th:first-child,table:not(.edit) td:first-child{position:sticky;left:0;background:var(--surface)}
@media (max-width:520px){table:not(.edit){font-size:13px}table:not(.edit) th,table:not(.edit) td{padding-right:8px}}
td.w{white-space:normal;min-width:132px}
tfoot td{font-weight:600;border-bottom:0;border-top:1px solid var(--axis)}
td .s{display:block;font-size:12px;color:var(--ink2);font-weight:400}
.note{font-size:13px;color:var(--ink2);margin-top:10px;max-width:72ch}
ul.plain{margin:6px 0 0;padding:0;list-style:none;max-width:70ch}
ul.plain li{padding:9px 0;border-bottom:1px solid var(--rule)}
ul.plain li:last-child{border-bottom:0}
.meter{display:flex;gap:2px;height:14px;margin:8px 0 6px}
.meter i{display:block;height:100%;min-width:2px}
.meter i:first-child{border-radius:4px 0 0 4px}.meter i:last-child{border-radius:0 4px 4px 0}.meter i:only-child{border-radius:4px}
.btn{background:var(--btn);color:var(--btn-ink);border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.quiet{background:none;color:var(--ink);border:1px solid var(--axis);font-weight:500}
.btn.tiny{padding:4px 9px;font-size:13px;border-radius:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.banner{background:var(--warn-bg);color:var(--warn-ink);padding:9px 12px;border-radius:8px;font-size:13.5px;margin:0 0 14px}
.msg{font-size:13.5px;margin:8px 0;min-height:1.2em}
textarea{width:100%;min-height:120px;border:1px solid var(--axis);border-radius:8px;background:var(--surface);padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
input[type=text],input[type=number],input[type=date],select{border:1px solid var(--axis);border-radius:6px;background:var(--surface);padding:5px 7px;min-width:0}
td input[type=number]{width:104px;text-align:right}
td input.narrow{width:76px}
td input[type=text]{width:100%;min-width:90px}
td input[type=date]{width:136px}
.edit td,.edit th{padding:4px 6px 4px 0;border-bottom:0}
.acct-edit{border-top:1px solid var(--rule);padding:4px 0}
.acct-edit>summary{font-size:15px;color:var(--ink);font-weight:600;padding:10px 0;width:auto}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px 12px;margin:4px 0 12px}
.fields label{display:grid;gap:3px;font-size:12.5px;color:var(--ink2)}
.hold{background:var(--band);border-radius:8px;padding:8px 10px;margin:2px 0 10px;position:sticky;left:0;width:fit-content;max-width:calc(100vw - 32px);overflow-x:auto}
.hold td input[type=text]{width:84px;min-width:0}
.pnote{position:sticky;left:0;max-width:min(560px,calc(100vw - 32px));white-space:normal}
.empty{padding:28px 0}
.empty h2{font-size:24px}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.35;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.22);font-variant-numeric:tabular-nums}
.tip[hidden]{display:none}
.tip-t{font-weight:600;margin-bottom:4px}
.tip-r{display:flex;align-items:center;gap:7px;justify-content:space-between}
.tip-r .l{display:inline-flex;align-items:center;gap:6px;opacity:.82}
.tip-r .k{width:10px;height:0;border-top:3px solid;border-radius:2px;display:inline-block}
.tip-r strong{margin-left:14px}
footer{border-top:1px solid var(--rule);padding:16px 0 30px;font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.chart .col{transition:opacity .12s}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><h1 id="title">Account Evaluator</h1><div class="asof" id="asof"></div></div></header>
<nav class="tabs"><div class="wrap" role="tablist" id="tabs"></div></nav>
<div class="scope" id="scopebar" hidden><div class="wrap" id="scope"></div></div>
<main><div class="wrap" id="main"></div></main>
<footer><div class="wrap">Figures come from the statement data loaded on this device and stay in this browser. Index returns are published totals with no fees. This is a record-keeping tool, not investment advice.</div></footer>
<div class="tip" id="tip" hidden></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
'use strict';
/* ---------- built-in reference data (public figures; all editable on the Data tab) ---------- */
// Total return, in percent, for the period ENDING on each date (calendar year, or year to date for a mid-year date).
const DEFAULT_BENCH={
  '2019-12-31':{sp:31.49,agg:8.72},'2020-12-31':{sp:18.40,agg:7.51},'2021-12-31':{sp:28.71,agg:-1.54},
  '2022-12-31':{sp:-18.11,agg:-13.01},'2023-12-31':{sp:26.29,agg:5.53},'2024-12-31':{sp:25.02,agg:1.25},
  '2025-12-31':{sp:17.88,agg:7.30},'2026-09-30':{sp:12.75,agg:-2.91}
};
const CLASSES=['US equity','Intl equity','Bonds','Cash','Crypto','Preferred','Other'];
const CLASS_COLOR={'US equity':'--s1','Intl equity':'--s2','Bonds':'--s3','Cash':'--s4','Crypto':'--s5','Preferred':'--s6','Other':'--s7'};
const DEFAULT_FUNDS={
  ITOT:{name:'iShares Core S&P Total U.S. Stock Market ETF',er:0.03,class:'US equity'},
  SPY:{name:'SPDR S&P 500 ETF Trust',er:0.0945,class:'US equity'},
  QQQ:{name:'Invesco QQQ Trust',er:0.18,class:'US equity'},
  DON:{name:'WisdomTree U.S. MidCap Dividend Fund',er:0.38,class:'US equity'},
  EZM:{name:'WisdomTree U.S. MidCap Fund',er:0.38,class:'US equity'},
  DGRW:{name:'WisdomTree U.S. Quality Dividend Growth Fund',er:0.28,class:'US equity'},
  SPYI:{name:'NEOS S&P 500 High Income ETF',er:0.68,class:'US equity'},
  VTI:{name:'Vanguard Total Stock Market ETF',er:0.03,class:'US equity'},
  VXUS:{name:'Vanguard Total International Stock ETF',er:0.05,class:'Intl equity'},
  BND:{name:'Vanguard Total Bond Market ETF',er:0.03,class:'Bonds'},
  VUSB:{name:'Vanguard Ultra-Short Bond ETF',er:0.10,class:'Bonds'},
  BTC:{name:'Grayscale Bitcoin Mini Trust ETF',er:0.15,class:'Crypto'},
  GBTC:{name:'Grayscale Bitcoin Trust ETF',er:1.50,class:'Crypto'},
  STRC:{name:'Strategy Inc. 9% Series A preferred stock',er:0,class:'Preferred'}
};
const BUCKETS=['pre-tax','Roth','taxable'];
const BUCKET_NAME={'pre-tax':'Pre-tax (taxed when withdrawn)','Roth':'Roth (tax-free)','taxable':'Taxable'};
const BUCKET_COLOR={'pre-tax':'--s1','Roth':'--s3','taxable':'--s2'};
const ACCT_COLORS=['--s1','--s2','--s3','--s7','--s5','--s6','--s4','--s8'];
const STORE='accountEvaluator.v1';
const TABS=[['overview','Overview'],['returns','Returns'],['bench','Benchmarks'],['alloc','Allocation & fees'],['data','Data']];

/* ---------- small helpers ---------- */
const $=(q,r=document)=>r.querySelector(q);
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k==='text') e.textContent=v;
    else if(k==='style') for(const [a,b] of Object.entries(v)) e.style.setProperty(a,b);
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else if(k==='value') e.value=v;
    else e.setAttribute(k,v===true?'':v);
  }
  for(const k of kids.flat(Infinity)){ if(k==null||k===false) continue; e.append(k.nodeType?k:document.createTextNode(String(k))); }
  return e;
}
const NS='http://www.w3.org/2000/svg';
function s(tag,attrs,...kids){
  const e=document.createElementNS(NS,tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null) continue;
    if(k==='text') e.textContent=v;
    else if(k==='style') for(const [a,b] of Object.entries(v)) e.style.setProperty(a,b);
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v);
  }
  for(const k of kids.flat(Infinity)) if(k) e.append(k);
  return e;
}
const cv=n=>`var(${n})`;
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const num=v=>{ const n=typeof v==='number'?v:parseFloat(String(v??'').replace(/[$,\s]/g,'')); return isFinite(n)?n:0; };
const MIN='−', DASH='—';
function fmt$(v,d=0){ if(v==null||!isFinite(v)) return DASH; const a=Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); return (v<0&&+Math.abs(v).toFixed(d)!==0?MIN:'')+'$'+a; }
function fmtK(v){ const a=Math.abs(v),g=v<0?MIN:''; if(a>=1e6) return g+'$'+(a/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'')+'M'; if(a>=1e4) return g+'$'+Math.round(a/1e3)+'K'; if(a>=1e3) return g+'$'+(a/1e3).toFixed(1).replace(/\.0$/,'')+'K'; return g+'$'+Math.round(a); }
function fmtPct(v,d=1,signed=false){ if(v==null||!isFinite(v)) return DASH; const z=+Math.abs(v*100).toFixed(d)===0; return (v<0&&!z?MIN:(signed&&v>0&&!z?'+':''))+Math.abs(v*100).toFixed(d)+'%'; }
const fmtPts=(v,d=1)=> v==null||!isFinite(v)?DASH:(v<0?MIN:'+')+Math.abs(v*100).toFixed(d)+' pts';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const T=d=>{ const [y,m,dd]=d.split('-').map(Number); return Date.UTC(y,m-1,dd); };
const isYE=d=>d.slice(5)==='12-31';
const dLong=d=>`${MON[+d.slice(5,7)-1]} ${+d.slice(8,10)}, ${d.slice(0,4)}`;
const dPoint=d=>isYE(d)?`End of ${d.slice(0,4)}`:dLong(d);                       // a balance date
const dPointShort=d=>isYE(d)?`'${d.slice(2,4)}`:`${+d.slice(5,7)}/${d.slice(2,4)}`;
// A period: a calendar year, a year to date, or (when statements are closer together) the two dates.
const pName=(d,from)=>{ if(from&&!(isYE(from)&&+d.slice(0,4)===+from.slice(0,4)+1)) return `${dLong(from)} to ${dLong(d)}`; return isYE(d)?d.slice(0,4):`${d.slice(0,4)} to ${MON[+d.slice(5,7)-1]} ${+d.slice(8,10)}`; };
const wholeYear=r=>isYE(r.to)&&isYE(r.from)&&+r.to.slice(0,4)===+r.from.slice(0,4)+1;
const years=(a,b)=>(T(b)-T(a))/(365.25*864e5);
const signCls=v=>v==null||!isFinite(v)||Math.abs(v)<5e-5?'':(v<0?'down':'up');

/* ---------- state & storage ---------- */
const state={data:null,scope:'all',tab:'overview',openAcct:new Set(),openHold:new Set(),msg:''};
function normalize(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.accounts)) throw new Error('That file has no "accounts" list, so it is not an Account Evaluator data file.');
  const out={schema:1,title:String(d.title||''),example:!!d.example,accounts:[],funds:{},benchmarks:{}};
  d.accounts.forEach((a,i)=>{
    if(!Array.isArray(a.periods)) throw new Error(`Account ${i+1} has no "periods" list.`);
    const acct={id:String(a.id||('acct'+(i+1))),label:String(a.label||a.type||('Account '+(i+1))),type:String(a.type||''),owner:String(a.owner||''),
      custodian:String(a.custodian||''),taxBucket:BUCKETS.includes(a.taxBucket)?a.taxBucket:'pre-tax',periods:[]};
    for(const p of a.periods){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(p.asOf||'')) throw new Error(`"${acct.label}" has a statement without a valid date (use YYYY-MM-DD).`);
      const q={asOf:p.asOf,end:num(p.end),contrib:num(p.contrib),withdraw:num(p.withdraw),cash:num(p.cash),fees:num(p.fees),
        dividends:p.dividends==null?null:num(p.dividends),interest:p.interest==null?null:num(p.interest),
        derived:!!p.derived,note:String(p.note||''),holdings:[]};
      for(const k of ['otherIncome','purchases','sales','realized','costBasis']) if(p[k]!=null) q[k]=num(p[k]);
      for(const x of (p.holdings||[])) q.holdings.push({symbol:String(x.symbol||'').toUpperCase(),qty:num(x.qty),price:num(x.price),value:num(x.value)});
      acct.periods.push(q);
    }
    acct.periods.sort((x,y)=>x.asOf<y.asOf?-1:1);
    out.accounts.push(acct);
  });
  for(const [k,v] of Object.entries(d.funds||{})) out.funds[k.toUpperCase()]={name:String(v.name||''),er:num(v.er),class:CLASSES.includes(v.class)?v.class:'Other'};
  for(const [k,v] of Object.entries(d.benchmarks||{})) if(/^\d{4}-\d{2}-\d{2}$/.test(k)) out.benchmarks[k]={sp:v.sp==null||v.sp===''?null:num(v.sp),agg:v.agg==null||v.agg===''?null:num(v.agg)};
  return out;
}
function save(){ try{ if(state.data) localStorage.setItem(STORE,JSON.stringify(state.data)); localStorage.setItem(STORE+'.ui',JSON.stringify({scope:state.scope,tab:state.tab})); }catch(e){} }
function load(){
  try{ const raw=localStorage.getItem(STORE); if(raw) state.data=normalize(JSON.parse(raw)); }catch(e){ state.data=null; }
  try{ const ui=JSON.parse(localStorage.getItem(STORE+'.ui')||'{}'); if(TABS.some(t=>t[0]===ui.tab)) state.tab=ui.tab; if(ui.scope) state.scope=ui.scope; }catch(e){}
}
function setData(obj,msg){ state.data=normalize(obj); state.scope='all'; state.msg=msg||''; save(); render(); }
function exportText(){ return JSON.stringify(state.data,null,1); }
function exampleData(){
  const yrs=['2020-12-31','2021-12-31','2022-12-31','2023-12-31','2024-12-31','2025-12-31'];
  const mk=(id,label,type,bucket,start,add,rets,mix)=>{ let v=start; const ps=[{asOf:'2019-12-31',end:start,holdings:[]}];
    yrs.forEach((d,i)=>{ v=Math.round((v*(1+rets[i])+add*(1+rets[i]/2))*100)/100; const cash=Math.round(v*mix.cash*100)/100; let left=v-cash; const hs=mix.h.map(([sym,w],j)=>{ const val=j===mix.h.length-1?Math.round(left*100)/100:Math.round((v-cash)*w*100)/100; left-=val; return {symbol:sym,qty:0,price:0,value:val}; });
      ps.push({asOf:d,end:v,contrib:add,withdraw:0,cash,interest:Math.round(cash*0.01)/1,dividends:Math.round(v*0.015),fees:id==='ex401k'?45:0,holdings:hs}); });
    return {id,label,type,taxBucket:bucket,owner:'Example',periods:ps}; };
  return {schema:1,title:'Example household',example:true,accounts:[
    mk('ex401k','401(k)','401(k)','pre-tax',182000,19500,[.142,.151,-.158,.176,.139,.121],{cash:.02,h:[['VTI',.55],['VXUS',.2],['BND',.25]]}),
    mk('exroth','Roth IRA','Roth IRA','Roth',41000,6000,[.201,.262,-.193,.257,.241,.172],{cash:.01,h:[['VTI',1]]}),
    mk('exbrk','Brokerage','Brokerage','taxable',60000,0,[.06,.04,-.05,.07,.09,.08],{cash:.45,h:[['SPY',.6],['BND',.4]]})]};
}

/* ---------- calculations ---------- */
const D=()=>state.data;
const funds=()=>({...DEFAULT_FUNDS,...D().funds});
const benchTable=()=>({...DEFAULT_BENCH,...D().benchmarks});

function summarize(rows){

function benchRet(date,key){

const BENCH_NAME={sp:'S&P 500',mix:'60/40 mix',agg:'US bonds'};
// Dollars the same money would be worth at index returns, with the same money in and out.
function benchTrack(accts,key){
  const tot={},bad=new Set();
  for(const a of accts){
    let v=a.periods[0].end; tot[a.periods[0].asOf]=(tot[a.periods[0].asOf]||0)+v;
    for(let i=1;i<a.periods.length;i++){
      const p=a.periods[i],r=benchRet(p.asOf,key);
      if(r==null||v==null){ v=null; bad.add(p.asOf); continue; }
      v=v*(1+r)+flowOf(p)*Math.sqrt(1+r); tot[p.asOf]=(tot[p.asOf]||0)+v;
    }
  }

const classOf=sym=>sym==='CASH'?'Cash':((funds()[sym]||{}).class||'Other');

function mixAt(accts,date){   // class -> dollars, plus holdings list

    const add=(sym,val)=>{ if(!val) return; cls[classOf(sym)]=(cls[classOf(sym)]||0)+val; (hold[sym]=hold[sym]||{symbol:sym,value:0,accts:[]}).value+=val; hold[sym].accts.push(a.label); total+=val; cost+=val*erOf(sym)/100; };

    h('div',{class:'row'},h('button',{class:'btn quiet',onclick:()=>{ const id='acct'+Date.now(); d.accounts.push({id,label:'New account',type:'',owner:'',custodian:'',taxBucket:'pre-tax',periods:[{asOf:(d.accounts[0]?d.accounts[0].periods[0].asOf:'2025-12-31'),end:0,contrib:0,withdraw:0,cash:0,fees:0,dividends:null,interest:null,derived:false,note:'',holdings:[]}]}); state.openAcct.add(id); commit(); },text:'Add an account'}))));
  const ends=combine(d.accounts).rows.map(r=>[r.to,r.from]),bt=benchTable();
  const bIn=(date,key)=>h('input',{type:'number',step:'any',inputmode:'decimal',class:'narrow',value:bt[date]&&bt[date][key]!=null?bt[date][key]:'','aria-label':`${key} ${date}`,onchange:e=>{ const cur={...(bt[date]||{sp:null,agg:null})}; cur[key]=e.target.value===''?null:num(e.target.value); d.benchmarks[date]=cur; commit(); }});
  out.push(section('Index returns','Total return in percent over each period shown. For a new statement date, look up the figure and type it in.',
    h('div',{class:'tscroll'},h('table',{class:'edit'},h('thead',null,h('tr',null,h('th',{class:'l',text:'Period'}),h('th',{text:'S&P 500 %'}),h('th',{text:'US bonds %'}))),
      h('tbody',null,ends.map(([e,f])=>h('tr',null,h('td',{class:'l w',text:pName(e,f)}),h('td',null,bIn(e,'sp')),h('td',null,bIn(e,'agg')))))))));
  const syms=[...new Set(d.accounts.flatMap(a=>a.periods.flatMap(p=>p.holdings.map(x=>x.symbol))))].filter(Boolean).sort(),fl=funds();
  const fSet=(sym,key,val)=>{ d.funds[sym]={...(fl[sym]||{name:'',er:0,class:'Other'}),[key]:val}; commit(); };
  if(syms.length) out.push(section('Fund costs and types','Expense ratios change now and then. Check the fund company\'s page if a figure matters.',
    h('div',{class:'tscroll'},h('table',{class:'edit'},h('thead',null,h('tr',null,h('th',{class:'l',text:'Symbol'}),h('th',{class:'l',text:'Name'}),h('th',{class:'l',text:'Type'}),h('th',{text:'Expense ratio %'}))),
      h('tbody',null,syms.map(sym=>{ const f=fl[sym]||{name:'',er:0,class:'Other'}; return h('tr',null,h('td',{class:'l',text:sym}),
        h('td',{class:'l'},h('input',{type:'text',value:f.name,'aria-label':`${sym} name`,style:{'min-width':'150px'},onchange:e=>fSet(sym,'name',e.target.value.trim())})),
        h('td',{class:'l'},h('select',{'aria-label':`${sym} type`,onchange:e=>fSet(sym,'class',e.target.value)},CLASSES.map(k=>h('option',{value:k,selected:f.class===k?true:null,text:k})))),
        h('td',null,h('input',{type:'number',step:'any',inputmode:'decimal',class:'narrow',value:f.er,'aria-label':`${sym} expense ratio`,onchange:e=>fSet(sym,'er',num(e.target.value))}))); }))))));
  return out;
}

/* ---------- shell ---------- */
function render(){
  hideTip(); pending=[];
  const d=D();
  if(d&&state.scope!=='all'&&!d.accounts.some(a=>a.id===state.scope)) state.scope='all';
  $('#title').textContent=d&&d.title?d.title:'Account Evaluator';
  document.title=d&&d.title?`${d.title} | Account Evaluator`:'Account Evaluator';
  const lastDate=d&&d.accounts.length?d.accounts.map(a=>a.periods[a.periods.length-1].asOf).sort().pop():null;
  $('#asof').textContent=lastDate?`Statements through ${dLong(lastDate)}`:'';
  $('#tabs').replaceChildren(...TABS.map(([id,name])=>h('button',{role:'tab','aria-selected':state.tab===id?'true':'false',onclick:()=>{ state.tab=id; state.msg=''; save(); render(); scrollTo(0,0); },text:name})));
  const showScope=d&&d.accounts.length>1&&state.tab!=='data';
  $('#scopebar').hidden=!showScope;
  if(showScope) $('#scope').replaceChildren(h('button',{class:'chip','aria-pressed':state.scope==='all'?'true':'false',onclick:()=>{ state.scope='all'; save(); render(); },text:'All accounts'}),
    ...d.accounts.map(a=>h('button',{class:'chip','aria-pressed':state.scope===a.id?'true':'false',onclick:()=>{ state.scope=a.id; save(); render(); }},h('i',{class:'dot',style:{background:cv(acctColor(a))}}),a.label)));
  const main=$('#main'); let body;
  if(state.tab==='data') body=viewData();
  else if(!d||!d.accounts.length) body=[viewEmpty()];
  else body=({overview:viewOverview,returns:viewReturns,bench:viewBench,alloc:viewAlloc})[state.tab]();
  main.replaceChildren(d&&d.example&&state.tab!=='data'?h('p',{class:'banner',text:'This is made-up example data. Load your own file on the Data tab.'}):null||'',...body);
  for(const f of pending) f();
}
$('#file').addEventListener('change',ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ setData(JSON.parse(rd.result),'Loaded. Everything on the other tabs now uses this data.'); if(state.tab==='data'){ state.tab='overview'; save(); render(); } }catch(e){ state.msg=e instanceof SyntaxError?'That file could not be read as a data file.':e.message; render(); } ev.target.value=''; };
  rd.readAsText(f);
});
let rz; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(state.tab!=='data') render(); },150); });
load(); render();
</script>
